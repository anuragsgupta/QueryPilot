# Netlify Configuration for QueryPilot
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Directory to deploy (contains index.html, css/, js/, and vendor/ assets)
  publish = "frontend"

# Environment variables defaults (override in Netlify Dashboard: Site configuration > Environment variables)
[build.environment]
  PYTHON_VERSION = "3.12"

# Security & asset caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# API Proxy Rule (Proxy /api/* to your FastAPI backend service e.g. on Render, Railway, Fly.io, or AWS)
# You can define BACKEND_URL in Netlify Site Environment Variables
[[redirects]]
  from = "/api/*"
  to = "https://querypilot-api.onrender.com/api/:splat"
  status = 200
  force = false

# SPA fallback rule for single-page routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
